[project]
name = "agentverse-uv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "siddhant754962", email = "kumarsidhant144@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.33.0",
    "langchain-chroma>=1.1.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.15",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.66.0",
    "tavily-python>=0.8.5",
]

[project.scripts]
agentverse-uv = "agentverse_uv:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
